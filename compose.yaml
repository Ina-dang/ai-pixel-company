name: ai-pixel-company-phase0
services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixel
      POSTGRES_DB: pixel_company
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local first}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pixel -d pixel_company']
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
volumes:
  postgres_data:
